[pytest]
testpaths = tests
asyncio_mode = auto
pythonpath = .
markers =
    integration: 실제 Hermes(hermes_cli) 가 설치된 venv 에서만 도는 통합 테스트 — `HERMES_INTEGRATION_REQUIRED=1` 이면 skip 이 실패가 된다
    patch_only: needs the Dante Labs policy core patch — deselected by the upstream Hermes main job
    upstream_known_break: fails on upstream Hermes main for a known, listed reason (README) — deselected by the upstream job only
    upstream_only: the review hooks' path, taken only on a Hermes without the policy core patch — deselected by the pinned job
