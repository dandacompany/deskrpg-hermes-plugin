name: deskrpg
version: 0.12.2
description: "DeskRPG 전용 라우트를 Hermes API Server 에 등록한다 — 프로필 목록·생성·삭제, SOUL.md 읽기/쓰기, 칸반·크론·사건(events) 스트림, 아티팩트 저장소와 artifact_save 도구."
author: Dante Labs
kind: standalone
requires_hermes: ">=0.21.1"

provides_tools:
  - artifact_save
  - propose_kanban_card
provides_hooks:
  - post_tool_call
  - post_llm_call
provides_middleware: []
requires_env: []
